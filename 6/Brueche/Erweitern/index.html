<body>
<header class="top"><div class="top-inner"><div class="brand"><div class="logo" aria-hidden="true">✦</div><div><h1>Die Bruchakademie</h1><p>Zauberlektion: Brüche erweitern</p></div></div><span class="top-tag">⏱️ 10–15 Minuten · Mathematik 6</span></div></header>
<main class="shell"><aside class="sidebar" aria-label="Lernpfad-Navigation"><h2>Deine 6 Lernstationen</h2><div class="progress-track" aria-label="Lernfortschritt"><div class="progress-fill" id="progress-fill"></div></div><p class="progress-txt" id="progress-text"></p><nav class="step-list" id="step-list"></nav><div class="side-note"><strong>Dein Lernstand wird gespeichert.</strong> Auf demselben Gerät und im selben Browser kannst du später weitermachen.</div></aside><article class="panel"><div class="panel-header"><span class="eyebrow" id="eyebrow">Station 1 von 6</span><span class="time" id="time">⏳ ca. 2 Minuten</span></div><div class="panel-body" id="content" aria-live="polite"></div><div class="footerline"><span id="save-state" class="save-state" aria-live="polite">● Automatisch gespeichert</span><button id="restart" type="button">Lernpfad neu beginnen</button></div></article></main>
<script>
(()=>{'use strict';
const KEY='bruchakademie-erweitern-v1';
const names=['Brüche entdecken','Teile verfeinern','Zauberregel','Erweiterungswerkstatt','Fehlerdetektivin','Ziel-Nenner'];
const times=['2 Minuten','2 Minuten','1 Minute','4 Minuten','2 Minuten','3 Minuten'];
const hints=[
 ['Vergleiche die grüne Fläche. Gesucht ist genau dieselbe Menge wie eine Hälfte.', 'Wenn ein Ganzes in vier gleich große Teile zerlegt wird, ist eine Hälfte mehr als ein Viertel.'],
 ['Beim Erweitern bleibt die gefärbte Fläche gleich groß – nur die Anzahl der kleinen Teile ändert sich.', 'Du hast zuerst 3 Teile. Wenn du jeden davon in 3 Stücke unterteilst, verändert sich auch der gefärbte Teil entsprechend.'],
 ['Der Wert des Bruchs soll unverändert bleiben. Das klappt nicht, wenn nur der Zähler oder nur der Nenner verändert wird.', 'Achte darauf, dass bei Zähler und Nenner dieselbe Multiplikation verwendet wird.'],
 ['Rechne für jede Aufgabe erst den Zähler mal Erweiterungszahl und dann den Nenner mal dieselbe Zahl.', 'Prüfe jede Zahl einzeln: Welche Rechnung steht über dem Bruchstrich, welche darunter?'],
 ['Lisa hat mit 3 erweitert. Vergleiche, was sie beim Zähler und beim Nenner gemacht hat.', 'Bei 2/5 musst du 2 · 3 und 5 · 3 rechnen. Beide Rechnungen gehören dazu.'],
 ['Klicke direkt bei einer Aufgabe auf „💡 Tipp zur Aufgabe“. Dort erfährst du, welche Division hilft.', 'Hast du die Erweiterungszahl gefunden, verwende sie für den Zähler und übertrage das Ergebnis in den Bruch.']
];
function blank(){return {version:2,step:0,unlocked:0,passed:Array(6).fill(false),entries:{},checks:{},hintLevels:{},targetHintLevels:{},completedAt:null};}
let storageOK=true;
function read(){try{const v=localStorage.getItem(KEY);if(!v)return blank();const prev=JSON.parse(v);if(!prev||typeof prev!=='object')return blank();const migrated=prev.version!==2;const next={...blank(),...prev,version:2,step:Math.max(0,Math.min(5,Number(prev.step)||0)),unlocked:Math.max(0,Math.min(5,Number(prev.unlocked)||0)),passed:Array.isArray(prev.passed)?Array.from({length:6},(_,i)=>prev.passed[i]===true):Array(6).fill(false),entries:prev.entries&&typeof prev.entries==='object'?prev.entries:{},checks:prev.checks&&typeof prev.checks==='object'?prev.checks:{},hintLevels:prev.hintLevels&&typeof prev.hintLevels==='object'?prev.hintLevels:{},targetHintLevels:prev.targetHintLevels&&typeof prev.targetHintLevels==='object'?prev.targetHintLevels:{}};
// Bestehende Eingaben erhalten, neue Rechnungen jedoch erneut prüfen.
if(migrated){next.passed[3]=false;next.passed[5]=false;delete next.checks[3];delete next.checks[5];next.completedAt=null;}
return next;}catch(e){storageOK=false;return blank();}}
let s=read();
function save(){try{localStorage.setItem(KEY,JSON.stringify(s));storageOK=true;}catch(e){storageOK=false;}setSave();}
function setSave(){const e=document.getElementById('save-state');if(!e)return;e.textContent=storageOK?'● Fortschritt automatisch gespeichert':'⚠ Speichern in diesem Browser nicht verfügbar';e.classList.toggle('warn',!storageOK);}
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function v(id){return s.entries[id]===undefined?'':String(s.entries[id]);}
function num(id){const x=v(id).trim();return /^\d+$/.test(x)?Number(x):NaN;}
function f(a,b,cls=''){return `<span class="fraction ${cls}" role="math" aria-label="${esc(a)} durch ${esc(b)}"><span class="topnum">${esc(a)}</span><span class="fracrule"></span><span class="bottomnum">${esc(b)}</span></span>`;}
function fi(id1,id2,label){return `<span class="fracinput"><input class="field" type="text" inputmode="numeric" autocomplete="off" pattern="[0-9]*" maxlength="3" data-entry="${esc(id1)}" value="${esc(v(id1))}" aria-label="${esc(label)} Zähler"><span class="fracrule"></span><input class="field" type="text" inputmode="numeric" autocomplete="off" pattern="[0-9]*" maxlength="3" data-entry="${esc(id2)}" value="${esc(v(id2))}" aria-label="${esc(label)} Nenner"></span>`;}
function inp(id,label){return `<input class="field inline-field" type="text" inputmode="numeric" autocomplete="off" pattern="[0-9]*" maxlength="3" data-entry="${esc(id)}" value="${esc(v(id))}" aria-label="${esc(label)}">`;}
function arrowLine(label,from,factorHTML,resultHTML){return `<div class="arrowline-wrap"><span class="mini-label">${label}</span><div class="arrowline"><span class="mini-num">${from}</span><span class="mini-dot">·</span>${factorHTML}<span class="mini-arrow">→</span>${resultHTML}</div></div>`;}
function bar(top,bottom,wide=false){return `<div class="bar ${wide?'wide':''}" role="img" aria-label="${top} von ${bottom} Teilen sind eingefärbt">${Array.from({length:bottom},(_,i)=>`<span class="slice ${i<top?'on':''}"></span>`).join('')}</div>`;}
function story(name,emoji,text){return `<div class="story"><div class="avatar" aria-hidden="true">${emoji}</div><p><strong>${name}:</strong> ${text}</p></div>`;}
function feedback(){const q=s.checks[s.step];if(!q)return '';return q.all?`<div class="feedback good" role="status"><strong>✓ Sehr gut!</strong>${q.message||'Du hast diese Station geschafft. Weiter geht’s!'}</div>`:`<div class="feedback bad" role="status"><strong>Fast! Prüfe deine Antworten noch einmal.</strong>${q.message||'Die markierten Stellen stimmen noch nicht. Nutze bei Bedarf einen Tipp.'}</div>`;}
function flag(key){const q=s.checks[s.step];if(!q||!q.items||q.items[key]===undefined)return '<span class="taskflag">Zum Prüfen</span>';return q.items[key]?'<span class="taskflag correct">✓ Richtig</span>':'<span class="taskflag wrong">↻ Noch einmal</span>';}
function itemMsg(key){const q=s.checks[s.step];if(!q||!q.items||q.items[key]===undefined)return '';return q.items[key]?'<div class="task-feedback correct">Das stimmt! Gut gemacht.</div>':`<div class="task-feedback">${esc(q.details&&q.details[key]?q.details[key]:'Überprüfe hier Zähler und Nenner. Sie müssen beide mit derselben Zahl erweitert werden.')}</div>`;}
function choices(id,opts,klass=''){return `<div class="choice-grid ${klass}">${opts.map(o=>`<button type="button" class="choice ${v(id)===o.value?'selected':''} ${o.class||''}" data-choice="${esc(id)}" data-value="${esc(o.value)}" aria-pressed="${v(id)===o.value}">${o.html}</button>`).join('')}</div>`;}
function taskRow(key,title,html){return `<div class="task"><div class="task-head"><strong>${title}</strong>${flag(key)}</div><div class="mathline">${html}</div>${itemMsg(key)}</div>`;}
function workshopTask(key,title,a,b,m){return `<div class="task"><div class="task-head"><strong>${title}</strong>${flag(key)}</div><p class="work-subtitle">1. Ergänze die beiden Multiplikationsaufgaben. Trage auch die Erweiterungszahl ein.</p><div class="work-steps"><div class="work-step"><div class="calc-row"><span class="calc-role">Zähler:</span><span>${a} ·</span>${inp(key+'zm',title+' Zähler Erweiterungszahl')}<span>=</span>${inp(key+'zr',title+' Ergebnis der Zähler-Rechnung')}</div></div><div class="work-step"><div class="calc-row"><span class="calc-role">Nenner:</span><span>${b} ·</span>${inp(key+'nm',title+' Nenner Erweiterungszahl')}<span>=</span>${inp(key+'nr',title+' Ergebnis der Nenner-Rechnung')}</div></div><div class="work-step"><span class="step-title">2. Übertrage die beiden Ergebnisse in den neuen Bruch.</span><div class="work-result">${f(a,b)}<span class="equals">=</span>${fi(key+'n',key+'d',title)}</div></div></div>${itemMsg(key)}</div>`;}
function targetHint(key,a,b,target){const level=Number(s.targetHintLevels[key]||0);if(!level)return '';return `<div class="hintbox" role="status">${level===1?`<strong>Tipp 1:</strong> Teile den Ziel-Nenner durch den ursprünglichen Nenner: <strong>${target} : ${b}</strong>. Das Ergebnis ist deine Erweiterungszahl.`:`<strong>Tipp 2:</strong> ${target} : ${b} = <strong>${target/b}</strong>. Multipliziere jetzt den Zähler ${a} mit derselben Erweiterungszahl.`}</div>`;}
function targetTask(key,title,a,b,target){const helper=Number(s.targetHintLevels[key]||0);return `<div class="task"><div class="task-head"><strong>${title}</strong>${flag(key)}</div><div class="target-steps"><div class="target-step"><span class="step-title">1. Finde die Erweiterungszahl für den Nenner.</span><div class="calc-row"><span>${b} ·</span>${inp(key+'m',title+' Erweiterungszahl des Nenners')}<span>= ${target}</span></div></div><div class="target-step"><span class="step-title">2. Verwende dieselbe Zahl beim Zähler.</span><div class="calc-row"><span>${a} ·</span>${inp(key+'zm',title+' Erweiterungszahl des Zählers')}<span>=</span>${inp(key+'calc',title+' Ergebnis der Zähler-Rechnung')}</div></div><div class="target-step"><span class="step-title">3. Ergänze den Ergebnisbruch.</span><div class="target-result">${f(a,b)}<span class="equals">=</span><span class="fracinput">${inp(key+'n',title+' Ergebniszähler')}<span class="fracrule"></span><span style="font-weight:800;font-size:1.3rem;padding:5px">${target}</span></span></div></div></div><div class="task-help"><button type="button" data-target-hint="${key}" ${helper>=2?'disabled':''}>💡 ${helper>=2?'Tipp eingeblendet':helper?'Noch ein Tipp':'Tipp zur Aufgabe'}</button>${targetHint(key,a,b,target)}</div>${itemMsg(key)}</div>`;}

function content(){switch(s.step){
case 0:return `<h2>Ein Bruch – verschiedene Stücke</h2><p class="lead">Eine Hälfte kann unterschiedlich aufgeteilt werden. Finde das Bild, das genau dieselbe Menge zeigt!</p>${story('Diana','👩🏻‍🦰','Ich habe eine halbe Tafel Zauberschokolade. Sieht das auch anders geteilt noch nach einer Hälfte aus?')}<div class="visual-card"><p class="visual-title">Dianas Schokolade</p><div class="fraction-row"><div class="fraction-block">${bar(1,2)}${f(1,2)}<span class="muted">Die Hälfte ist grün.</span></div></div></div><p class="question">Welches Bild zeigt genau die gleiche grüne Fläche?</p>${choices('pic',[{value:'a',html:`${bar(1,4)}${f(1,4,'tiny')}`},{value:'b',html:`${bar(2,4)}${f(2,4,'tiny')}`},{value:'c',html:`${bar(3,4)}${f(3,4,'tiny')}`}])}${feedback()}${s.passed[0]?'<div class="explain">Du hast entdeckt: <strong>1/2 und 2/4</strong> beschreiben gleich viel. Wir haben jedes Teilstück noch einmal geteilt, ohne die Menge zu verändern.</div>':''}`;
case 1:{const m=Number(v('split'))||1;return `<h2>Was passiert beim Zerteilen?</h2><p class="lead">Du kannst jeden Teil eines Bruchs in noch kleinere, gleich große Stücke zerlegen.</p>${story('Lisa','👩🏽','Ich starte mit einem Drittel. Wenn ich alle drei Teile in je 3 Stücke teile, ändert sich die grüne Fläche bestimmt nicht!')}<div class="visual-card"><div class="help-compare"><div class="fraction-block">${bar(1,3,true)}${f(1,3)}<span class="muted">Ausgangsbruch</span></div><span class="equals" aria-hidden="true">→</span><div class="fraction-block">${bar(m,3*m,true)}${f(m,3*m)}<span class="muted">Nach dem Zerteilen</span></div></div></div><p class="question">1. Teile jedes Stück weiter. Probiere beide Möglichkeiten aus.</p>${choices('split',[{value:'2',html:'Jedes Teil in <strong>2</strong> Stücke teilen',class:'compact'},{value:'3',html:'Jedes Teil in <strong>3</strong> Stücke teilen',class:'compact'}],'two')}<p class="question">2. Wähle „in 3 Stücke“: Wie viele der 9 kleinen Teile sind dann grün?</p><div class="answer-bits"><label class="labelwrap"><span class="field-label">Grüne Teile:</span>${inp('colored','Anzahl der grünen Teile')}</label><span class="smallcaps">von 9 Teilen</span></div>${feedback()}${s.passed[1]?'<div class="explain">Genau: Aus <strong>1/3</strong> wurde <strong>3/9</strong>. Beide Brüche zeigen gleich viel. Das heißt <strong>Erweitern</strong>.</div>':''}`;}
case 2:return `<h2>Der Erweiterungszauber</h2><p class="lead">Brian zeigt dir die Regel für alle Brüche.</p>${story('Brian','🤖','Du darfst einen Bruch erweitern, indem du Zähler und Nenner mit derselben Zahl multiplizierst.')}<div class="visual-card"><p class="visual-title">Beispiel: mit 3 erweitern</p><div class="arrow-demo"><div class="arrow-fractions">${f(2,5)}<span class="equals">=</span>${f(6,15)}</div><div class="arrow-work">${arrowLine('Zähler',2,'<span class="mini-factor">3</span>','<span class="mini-result">6</span>')}${arrowLine('Nenner',5,'<span class="mini-factor">3</span>','<span class="mini-result">15</span>')}</div><p class="mini-note">Fachsprache: Beim Erweitern werden <strong>Zähler</strong> und <strong>Nenner</strong> mit derselben Zahl multipliziert.</p></div></div><p class="question">Welche Regel ist richtig?</p>${choices('rule',[{value:'one',html:'Ich multipliziere <strong>nur den Zähler</strong>'},{value:'different',html:'Ich multipliziere Zähler und Nenner mit <strong>verschiedenen Zahlen</strong>'},{value:'both',html:'Ich multipliziere <strong>Zähler und Nenner mit derselben Zahl</strong>'}],'rules')}${feedback()}${s.passed[2]?'<div class="formula-note"><strong>Merksatz fürs Heft:</strong> Beim Erweitern werden Zähler und Nenner mit derselben natürlichen Zahl (größer als 1) multipliziert. Der Wert des Bruchs bleibt gleich.</div>':''}`;
case 3:return `<h2>Die Erweiterungswerkstatt</h2><p class="lead">Erweitere die Brüche Schritt für Schritt: <strong>Schreibe erst die Multiplikationsaufgaben auf</strong> und trage dann die Ergebnisse in den Bruch ein.</p>${story('Walli','👧🏽','Beim Zähler und beim Nenner verwende ich immer dieselbe Erweiterungszahl.')}<div class="task-stack">${[
 ['w1','Aufgabe 1 · mit 3 erweitern',2,3,3],['w2','Aufgabe 2 · mit 2 erweitern',3,4,2],['w3','Aufgabe 3 · mit 4 erweitern',4,5,4]
].map(([key,title,a,b,m])=>workshopTask(key,title,a,b,m)).join('')}</div>${feedback()}`;
case 4:return `<h2>Fehlerdetektivin gesucht!</h2><p class="lead">Lisa hat einen Bruch erweitert – aber ihr Ergebnis stimmt nicht. Findest du ihren Denkfehler?</p>${story('Lisa','👩🏽','Ich wollte mit 3 erweitern und habe so gerechnet. Irgendetwas ist schiefgegangen …')}<div class="visual-card"><div class="fraction-row">${f(2,5)}<span class="factor-chip">mit 3 erweitern</span><span class="equals">=</span>${f(6,5)}<span style="font-size:1.3rem" aria-hidden="true">❌</span></div></div><p class="question">1. Was hat Lisa falsch gemacht?</p>${choices('error',[{value:'only-top',html:'Sie hat nur den <strong>Zähler</strong> multipliziert.'},{value:'only-bottom',html:'Sie hat nur den <strong>Nenner</strong> multipliziert.'},{value:'nothing',html:'Alles ist richtig.'}],'rules')}<p class="question">2. Verbessere das Ergebnis:</p><div class="visual-card"><div class="mathline">${f(2,5)}<span class="factor-chip">mit 3 erweitern</span><span class="equals">=</span>${fi('fixn','fixd','Korrigierter Bruch')}</div></div>${feedback()}`;
case 5:return `<h2>Finde den Ziel-Nenner</h2><p class="lead">Du kennst den Ziel-Nenner. Suche zuerst die Erweiterungszahl und berechne dann den neuen Zähler. Jede Aufgabe hat einen eigenen Tipp-Button!</p>${story('Diana','👩🏻‍🦰','Ich frage mich zuerst: Mit welcher Zahl muss ich den alten Nenner multiplizieren, um den Ziel-Nenner zu erhalten? Wenn ich nicht weiterkomme, verwende ich den Tipp.')}<div class="task-stack">${[
 ['t1','Aufgabe 1',3,4,20],['t2','Aufgabe 2',2,7,21],['t3','Aufgabe 3',4,5,25]
].map(([key,title,a,b,target])=>targetTask(key,title,a,b,target)).join('')}</div>${feedback()}${s.passed[5]?`<section class="completion" aria-label="Abschluss"><div class="medal" aria-hidden="true">🏅</div><h3>Geschafft – du bist Bruchmagierin!</h3><p>Alle <strong>6 Lernstationen</strong> sind abgeschlossen. Du kannst Brüche erweitern und die Erweiterungszahl aus dem Ziel-Nenner bestimmen.</p></section>`:''}`;
}}
function validate(){let items={},details={},message='';switch(s.step){
case 0:items={pic:v('pic')==='b'};message='Die grüne Hälfte muss genauso groß bleiben.';break;
case 1:items={split:v('split')==='3',colored:num('colored')===3};message='Wähle „in 3 Stücke teilen“ und zähle dann die grünen Felder.';break;
case 2:items={rule:v('rule')==='both'};message='Der Bruchwert bleibt nur erhalten, wenn Zähler und Nenner mit derselben Zahl multipliziert werden.';break;
case 3:{const jobs=[['w1',2,3,3],['w2',3,4,2],['w3',4,5,4]];for(const [k,a,b,m] of jobs){const top=num(k+'zm')===m&&num(k+'zr')===a*m;const bottom=num(k+'nm')===m&&num(k+'nr')===b*m;const result=num(k+'n')===a*m&&num(k+'d')===b*m;items[k]=top&&bottom&&result;details[k]=!top?'Prüfe die Multiplikation des Zählers.':!bottom?'Prüfe die Multiplikation des Nenners.':'Übertrage die Ergebnisse in Zähler und Nenner des Bruchs.';}message='Schreibe bei jedem Bruch zuerst beide Rechenwege vollständig auf und übertrage dann die Ergebnisse.';break;}
case 4:items={err:v('error')==='only-top',fix:num('fixn')===6&&num('fixd')===15};message='Überprüfe, ob auch der Nenner mit 3 multipliziert wurde.';break;
case 5:{const jobs=[['t1',3,4,20],['t2',2,7,21],['t3',4,5,25]];for(const [k,a,b,target] of jobs){const m=target/b;const step1=num(k+'m')===m;const step2=num(k+'zm')===m&&num(k+'calc')===a*m;const result=num(k+'n')===a*m;items[k]=step1&&step2&&result;details[k]=!step1?'Schritt 1: Welche Zahl mal dem bisherigen Nenner ergibt den Ziel-Nenner?':!step2?'Schritt 2: Multipliziere den Zähler mit derselben Zahl.':'Schritt 3: Übertrage das Ergebnis der Zähler-Rechnung in den Ergebnisbruch.';}message='Prüfe die markierten Rechenschritte. Bei jeder Aufgabe hilft ein eigener Tipp-Button.';break;}
}
const all=Object.values(items).every(Boolean);const attempts=(s.checks[s.step]?.attempts||0)+1;
s.checks[s.step]={all,items,details,message:all?'Du hast alle Antworten richtig gelöst.':message,attempts};s.passed[s.step]=all;
if(all){s.unlocked=Math.max(s.unlocked,Math.min(5,s.step+1));if(s.step===5)s.completedAt=new Date().toISOString();}
else if(s.step===5)s.completedAt=null;
save();render();const el=document.querySelector('.feedback');if(el)el.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function markDirty(){if(s.checks[s.step])delete s.checks[s.step];if(s.passed[s.step]){s.passed[s.step]=false;if(s.step===5)s.completedAt=null;}}
function nav(n){if(n<0||n>5||n>s.unlocked)return;s.step=n;save();render();window.scrollTo({top:0,behavior:'smooth'});}
function render(){const count=s.passed.filter(Boolean).length;document.getElementById('progress-fill').style.width=(count/6*100)+'%';document.getElementById('progress-text').textContent=`${count} von 6 Stationen geschafft`;
document.getElementById('step-list').innerHTML=names.map((name,i)=>`<button type="button" class="navstep ${i===s.step?'current':''} ${s.passed[i]?'done':''}" data-nav="${i}" ${i>s.unlocked?'disabled':''} ${i===s.step?'aria-current="step"':''}><span class="numb">${s.passed[i]?'✓':i+1}</span><span>${name}</span></button>`).join('');
document.getElementById('eyebrow').textContent=`Station ${s.step+1} von 6`;
document.getElementById('time').textContent=`⏳ ca. ${times[s.step]}`;
const k=s.step;
const lvl=Number(s.hintLevels[k]||0);
document.getElementById('content').innerHTML=content()+`${lvl?`<div class="hintbox" role="status"><p><strong>💡 ${lvl>1?'Noch ein Tipp':'Tipp'}:</strong> ${hints[k][Math.min(lvl,2)-1]}</p></div>`:''}<div class="actions">${k>0?`<button class="btn secondary" type="button" data-nav="${k-1}">← Zurück</button>`:''}<button class="btn hint" type="button" data-hint>💡 ${lvl?'Weiterer Tipp':'Tipp anzeigen'}</button>${k!==0&&k!==2?`<button class="btn primary" type="button" data-check>Antworten prüfen</button>`:''}${s.passed[k]&&k<5?`<button class="btn primary right" type="button" data-nav="${k+1}">Weiter →</button>`:''}${s.passed[k]&&k===5?'<button class="btn secondary right" type="button" data-print>🏅 Abschluss drucken</button>':''}</div>`;
setSave();}
// Eingaben werden bei jedem einzelnen Tastendruck gespeichert, ohne den Schreibfokus zu verlieren.
document.addEventListener('input',e=>{const el=e.target.closest('[data-entry]');if(!el)return;let z=el.value.replace(/[^0-9]/g,'');if(el.value!==z){const pos=el.selectionStart;el.value=z;try{el.setSelectionRange(Math.min(pos,z.length),Math.min(pos,z.length));}catch(_){}}
s.entries[el.dataset.entry]=el.value;markDirty();save();});
document.addEventListener('click',e=>{const navbtn=e.target.closest('[data-nav]');if(navbtn){nav(Number(navbtn.dataset.nav));return;}
const choice=e.target.closest('[data-choice]');if(choice){s.entries[choice.dataset.choice]=choice.dataset.value;markDirty();save();if(s.step===0||s.step===2)validate();else render();return;}
const taskHint=e.target.closest('[data-target-hint]');if(taskHint){const key=taskHint.dataset.targetHint;s.targetHintLevels[key]=Math.min(2,Number(s.targetHintLevels[key]||0)+1);save();render();return;}
if(e.target.closest('[data-hint]')){s.hintLevels[s.step]=Math.min(2,Number(s.hintLevels[s.step]||0)+1);save();render();return;}
if(e.target.closest('[data-check]')){validate();return;}
if(e.target.closest('[data-print]')){window.print();return;}
if(e.target.closest('#restart')){if(window.confirm('Willst du wirklich alle Antworten und deinen gesamten Fortschritt löschen?')){s=blank();save();render();window.scrollTo(0,0);}return;}
});
render();
})();
</script>
</body>
</html>
