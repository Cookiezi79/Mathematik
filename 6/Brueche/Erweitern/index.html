<header class="top"><div class="top-inner"><div class="brand"><div class="logo" aria-hidden="true">✦</div><div><h1>Die Bruchakademie</h1><p>Zauberlektion: Brüche kürzen</p></div></div><span class="top-tag">⏱️ 10–15 Minuten · Mathematik 6</span></div></header>
<main class="shell"><aside class="sidebar" aria-label="Lernpfad-Navigation"><h2>Deine 6 Lernstationen</h2><div class="progress-track" aria-label="Lernfortschritt"><div class="progress-fill" id="progress-fill"></div></div><p class="progress-txt" id="progress-text"></p><nav class="step-list" id="step-list"></nav><div class="side-note"><strong>Dein Lernstand wird gespeichert.</strong> Du kannst auf demselben Gerät im selben Browser weiterarbeiten.</div></aside><article class="panel"><div class="panel-header"><span class="eyebrow" id="eyebrow">Station 1 von 6</span><span class="time" id="time">⏳ ca. 2 Minuten</span></div><div class="panel-body" id="content" aria-live="polite"></div><div class="footerline"><span id="save-state" class="save-state" aria-live="polite">● Automatisch gespeichert</span><button id="restart" type="button">Lernpfad neu beginnen</button></div></article></main>
<script>
(()=>{'use strict';
const KEY='bruchakademie-kuerzen-v1';
const names=['Brüche entdecken','Stücke zusammenfassen','Kürzungsregel','Kürzungswerkstatt','Fehlerdetektivin','Ziel-Nenner'];
const times=['2 Minuten','2 Minuten','1 Minute','4 Minuten','2 Minuten','3 Minuten'];
const hints=[
 ['Vergleiche die grüne Fläche. Gesucht ist die gleiche Menge wie vier von acht Stücken.', 'Vier von acht Teilen sind genau eine Hälfte des Ganzen.'],
 ['Beim Zusammenfassen werden die einzelnen Teilstücke größer, die grüne Fläche bleibt gleich.', 'Vier grüne von acht kleinen Stücken: Immer vier Stücke werden zu einem großen Stück zusammengefasst.'],
 ['Beim Kürzen muss sich der Wert des Bruchs nicht ändern.', 'Zähler und Nenner werden durch dieselbe Zahl geteilt – bei beiden muss die Division ohne Rest möglich sein.'],
 ['Suche Zähler und Nenner. Trage bei beiden dieselbe Kürzungszahl ein.', 'Schreibe die beiden Divisionen vollständig auf. Übertrage danach die Ergebnisse in den Bruch.'],
 ['Schau, welche Zahl Lisa verändert und welche sie unverändert gelassen hat.', 'Bei 6/9 kürzen mit 3 rechnest du 6 : 3 und 9 : 3.'],
 ['Benutze den gelben Tipp-Button bei jeder Aufgabe.', 'Beim Kürzen findest du die Kürzungszahl, indem du den bisherigen Nenner durch den Ziel-Nenner teilst.']
];
function blank(){return {version:1,step:0,unlocked:0,passed:Array(6).fill(false),entries:{},checks:{},hintLevels:{},targetHintLevels:{},completedAt:null};}
let storageOK=true;
function read(){try{const raw=localStorage.getItem(KEY);if(!raw)return blank();const prev=JSON.parse(raw);if(!prev||typeof prev!=='object')return blank();return {...blank(),...prev,step:Math.max(0,Math.min(5,Number(prev.step)||0)),unlocked:Math.max(0,Math.min(5,Number(prev.unlocked)||0)),passed:Array.isArray(prev.passed)?Array.from({length:6},(_,i)=>prev.passed[i]===true):Array(6).fill(false),entries:prev.entries&&typeof prev.entries==='object'?prev.entries:{},checks:prev.checks&&typeof prev.checks==='object'?prev.checks:{},hintLevels:prev.hintLevels&&typeof prev.hintLevels==='object'?prev.hintLevels:{},targetHintLevels:prev.targetHintLevels&&typeof prev.targetHintLevels==='object'?prev.targetHintLevels:{}}}catch(_){storageOK=false;return blank()}}
let s=read();
function save(){try{localStorage.setItem(KEY,JSON.stringify(s));storageOK=true}catch(_){storageOK=false}setSave()}
function setSave(){const e=document.getElementById('save-state');if(!e)return;e.textContent=storageOK?'● Fortschritt automatisch gespeichert':'⚠ Speichern in diesem Browser nicht verfügbar';e.classList.toggle('warn',!storageOK)}
function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function val(id){return s.entries[id]===undefined?'':String(s.entries[id])}
function num(id){const t=val(id).trim();return /^\d+$/.test(t)?Number(t):NaN}
function f(a,b,cls=''){return `<span class="fraction ${cls}" role="math" aria-label="${esc(a)} durch ${esc(b)}"><span class="topnum">${esc(a)}</span><span class="fracrule"></span><span class="bottomnum">${esc(b)}</span></span>`}
function inp(id,label){return `<input class="field inline-field" type="text" inputmode="numeric" autocomplete="off" pattern="[0-9]*" maxlength="3" data-entry="${esc(id)}" value="${esc(val(id))}" aria-label="${esc(label)}">`}
function fi(n,d,label){return `<span class="fracinput">${inp(n,label+' Zähler')}<span class="fracrule"></span>${inp(d,label+' Nenner')}</span>`}
function bar(a,b,wide=false){return `<div class="bar ${wide?'wide':''}" role="img" aria-label="${a} von ${b} gleich großen Teilen eingefärbt">${Array.from({length:b},(_,i)=>`<span class="slice ${i<a?'on':''}"></span>`).join('')}</div>`}
function arrow(label,from,divisor,result){return `<div class="arrowline-wrap"><span class="mini-label">${label}</span><div class="arrowline"><span class="mini-num">${from}</span><span class="mini-dot">:</span><span class="mini-factor">${divisor}</span><span class="mini-arrow">→</span><span class="mini-result">${result}</span></div></div>`}
function story(name,emoji,txt){return `<div class="story"><span class="avatar" aria-hidden="true">${emoji}</span><p><strong>${name}:</strong> ${txt}</p></div>`}
function choices(id,options,klass=''){return `<div class="choice-grid ${klass}">${options.map(o=>`<button type="button" class="choice ${val(id)===o.value?'selected':''} ${o.class||''}" data-choice="${esc(id)}" data-value="${esc(o.value)}" aria-pressed="${val(id)===o.value}">${o.html}</button>`).join('')}</div>`}
function flag(k){const c=s.checks[s.step];if(!c||c.items?.[k]===undefined)return `<span class="taskflag">Zum Prüfen</span>`;return c.items[k]?'<span class="taskflag correct">✓ Richtig</span>':'<span class="taskflag wrong">↻ Noch einmal</span>'}
function itemMsg(k){const c=s.checks[s.step];if(!c||c.items?.[k]===undefined)return '';return c.items[k]?'<div class="task-feedback correct">Richtig! Beide Divisionen passen.</div>':`<div class="task-feedback">${esc(c.details?.[k]||'Prüfe deine Rechnungen. Beim Kürzen werden Zähler und Nenner durch dieselbe Zahl geteilt.')}</div>`}
function feedback(){const c=s.checks[s.step];if(!c)return '';return c.all?`<div class="feedback good" role="status"><strong>✓ Sehr gut!</strong>${esc(c.message)}</div>`:`<div class="feedback bad" role="status"><strong>Prüfe noch einmal!</strong>${esc(c.message)}</div>`}
function workshopTask(k,title,a,b,d){return `<section class="task"><div class="task-head"><strong>${title}</strong>${flag(k)}</div><p class="work-subtitle">1. Ergänze beide Divisionsaufgaben. Schreibe auch die Kürzungszahl in die gelben Felder.</p><div class="work-steps"><div class="work-step"><div class="calc-row"><span class="calc-role">Zähler:</span><span>${a} :</span>${inp(k+'zm',title+' Kürzungszahl Zähler')}<span>=</span>${inp(k+'zr',title+' Ergebnis Zähler')}</div></div><div class="work-step"><div class="calc-row"><span class="calc-role">Nenner:</span><span>${b} :</span>${inp(k+'nm',title+' Kürzungszahl Nenner')}<span>=</span>${inp(k+'nr',title+' Ergebnis Nenner')}</div></div><div class="work-step"><span class="step-title">2. Übertrage die Ergebnisse in den neuen Bruch.</span><div class="work-result">${f(a,b)}<span class="equals">=</span>${fi(k+'n',k+'d',title)}</div></div></div>${itemMsg(k)}</section>`}
function targetHint(k,a,b,t){const lvl=Number(s.targetHintLevels[k]||0);if(!lvl)return '';const d=b/t;return `<div class="hintbox" role="status">${lvl===1?`<strong>Tipp 1:</strong> Teile den bisherigen Nenner durch den Ziel-Nenner: <strong>${b} : ${t}</strong>. So findest du die Kürzungszahl.`:`<strong>Tipp 2:</strong> ${b} : ${t} = <strong>${d}</strong>. Teile nun auch den Zähler ${a} durch <strong>${d}</strong>.`}</div>`}
function targetTask(k,title,a,b,target){const lvl=Number(s.targetHintLevels[k]||0);return `<section class="task"><div class="task-head"><strong>${title}</strong>${flag(k)}</div><div class="target-steps"><div class="target-step"><span class="step-title">1. Finde die Kürzungszahl mithilfe des Nenners.</span><div class="calc-row"><span>${b} :</span>${inp(k+'m',title+' Kürzungszahl des Nenners')}<span>= ${target}</span></div></div><div class="target-step"><span class="step-title">2. Teile den Zähler durch dieselbe Zahl.</span><div class="calc-row"><span>${a} :</span>${inp(k+'zm',title+' Kürzungszahl des Zählers')}<span>=</span>${inp(k+'calc',title+' Ergebnis Zähler')}</div></div><div class="target-step"><span class="step-title">3. Ergänze den Ergebnisbruch.</span><div class="target-result">${f(a,b)}<span class="equals">=</span><span class="fracinput">${inp(k+'n',title+' Zähler im Ergebnisbruch')}<span class="fracrule"></span><span style="font-size:1.35rem;font-weight:800;padding:5px">${target}</span></span></div></div></div><div class="task-help"><button type="button" data-target-hint="${k}" ${lvl>=2?'disabled':''}>💡 ${lvl>=2?'Tipps eingeblendet':lvl?'Weiterer Tipp':'Tipp zur Aufgabe'}</button>${targetHint(k,a,b,target)}</div>${itemMsg(k)}</section>`}
function content(){switch(s.step){
case 0:return `<h2>Viele kleine Stücke – derselbe Anteil</h2><p class="lead">Beim Kürzen kann man einen Bruch mit weniger, dafür größeren Teilstücken darstellen. Die Menge bleibt gleich.</p>${story('Diana','👩🏻‍🦰','Vier von acht Stücken Zauberschokolade sind grün. Welche Darstellung zeigt dieselbe grüne Fläche?')}<div class="visual-card"><p class="visual-title">Dianas Schokolade</p><div class="fraction-row"><div class="fraction-block">${bar(4,8)}${f(4,8)}<span class="muted">Ausgangsbruch</span></div></div></div><p class="question">Welches Bild zeigt den gleichen Anteil?</p>${choices('pic',[{value:'a',html:`${bar(1,4)}${f(1,4,'tiny')}`},{value:'b',html:`${bar(1,2)}${f(1,2,'tiny')}`},{value:'c',html:`${bar(3,4)}${f(3,4,'tiny')}`}])}${feedback()}${s.passed[0]?'<div class="explain">Richtig: <strong>4/8 = 1/2</strong>. Wir beschreiben dieselbe Fläche mit weniger Teilstücken.</div>':''}`;
case 1:{const g=Number(val('group'))||1;const shown=g===1?{n:4,d:8}:{n:4/g,d:8/g};return `<h2>Stücke zusammenfassen</h2><p class="lead">Fasse gleich große kleine Teile zu größeren Stücken zusammen. Die grüne Fläche bleibt gleich!</p>${story('Lisa','👩🏽','Ich habe vier grüne Stücke von acht. Wenn ich immer vier kleine Stücke zusammenfasse, bekomme ich einen viel einfacheren Bruch.')}<div class="visual-card"><div class="help-compare"><div class="fraction-block">${bar(4,8,true)}${f(4,8)}<span class="muted">Vor dem Zusammenfassen</span></div><span class="equals" aria-hidden="true">→</span><div class="fraction-block">${bar(shown.n,shown.d,true)}${f(shown.n,shown.d)}<span class="muted">Nach dem Zusammenfassen</span></div></div></div><p class="question">1. Probiere aus, wie viele kleine Stücke du jeweils zusammenfasst.</p>${choices('group',[{value:'2',html:'Je <strong>2</strong> kleine Stücke zusammenfassen',class:'compact'},{value:'4',html:'Je <strong>4</strong> kleine Stücke zusammenfassen',class:'compact'}],'two')}<p class="question">2. Wähle „je 4“. Aus wie vielen grünen Teilen besteht der neue Bruch? Wie viele Teile gibt es insgesamt?</p><div class="answer-bits"><label class="labelwrap"><span class="field-label">Grüne Teile:</span>${inp('green','Anzahl grüne Teile')}</label><label class="labelwrap"><span class="field-label">Alle Teile:</span>${inp('all','Anzahl aller Teile')}</label></div>${feedback()}${s.passed[1]?'<div class="explain">Du hast entdeckt: <strong>4/8 = 1/2</strong>. Dabei teilen wir sowohl den Zähler als auch den Nenner durch <strong>4</strong>. Das heißt <strong>Kürzen</strong>.</div>':''}`;}
case 2:return `<h2>Der Kürzungszauber</h2><p class="lead">So geht Kürzen mit der richtigen Fachsprache.</p>${story('Brian','🤖','Beim Kürzen werden Zähler und Nenner durch dieselbe natürliche Zahl geteilt. Beide Divisionen müssen ohne Rest möglich sein.')}<div class="visual-card"><p class="visual-title">Beispiel: mit 3 kürzen</p><div class="arrow-demo"><div class="arrow-fractions">${f(6,9)}<span class="equals">=</span>${f(2,3)}</div><div class="arrow-work">${arrow('Zähler',6,3,2)}${arrow('Nenner',9,3,3)}</div><p class="mini-note">Sowohl der <strong>Zähler</strong> als auch der <strong>Nenner</strong> werden durch 3 geteilt. Der Bruchwert bleibt gleich.</p></div></div><p class="question">Welche Regel ist richtig?</p>${choices('rule',[{value:'one',html:'Ich teile <strong>nur den Zähler</strong>'},{value:'different',html:'Ich teile Zähler und Nenner durch <strong>verschiedene Zahlen</strong>'},{value:'both',html:'Ich teile <strong>Zähler und Nenner durch dieselbe Zahl ohne Rest</strong>'}],'rules')}${feedback()}${s.passed[2]?'<div class="formula-note"><strong>Merksatz fürs Heft:</strong> Beim Kürzen teilst du Zähler und Nenner durch dieselbe natürliche Zahl (größer als 1). Beide Divisionen müssen ohne Rest möglich sein. Der Wert des Bruchs bleibt unverändert.</div>':''}`;
case 3:return `<h2>Die Kürzungswerkstatt</h2><p class="lead">Kürze die Brüche Schritt für Schritt: <strong>Schreibe zuerst beide Divisionsaufgaben auf</strong> und trage dann den Ergebnisbruch ein.</p>${story('Walli','👧🏽','Ich verwende dieselbe Kürzungszahl für den Zähler und für den Nenner.')}<div class="task-stack">${[['w1','Aufgabe 1 · mit 3 kürzen',6,9,3],['w2','Aufgabe 2 · mit 4 kürzen',8,12,4],['w3','Aufgabe 3 · mit 5 kürzen',15,20,5]].map(x=>workshopTask(...x)).join('')}</div>${feedback()}`;
case 4:return `<h2>Fehlerdetektivin gesucht!</h2><p class="lead">Lisa hat einen Bruch gekürzt. Dabei hat sie einen Fehler gemacht. Findest du ihn?</p>${story('Lisa','👩🏽','Ich wollte mit 3 kürzen. Irgendetwas an meinem Ergebnis ist falsch …')}<div class="visual-card"><div class="fraction-row">${f(6,9)}<span class="factor-chip">mit 3 kürzen</span><span class="equals">=</span>${f(2,9)}<span style="font-size:1.3rem" aria-hidden="true">❌</span></div></div><p class="question">1. Was hat Lisa falsch gemacht?</p>${choices('error',[{value:'only-top',html:'Sie hat <strong>nur den Zähler</strong> geteilt'},{value:'only-bottom',html:'Sie hat <strong>nur den Nenner</strong> geteilt'},{value:'nothing',html:'Alles ist richtig'}],'rules')}<p class="question">2. Verbessere ihren Bruch:</p><div class="visual-card"><div class="mathline">${f(6,9)}<span class="factor-chip">mit 3 kürzen</span><span class="equals">=</span>${fi('fixn','fixd','Verbesserter Bruch')}</div></div>${feedback()}`;
case 5:return `<h2>Finde den Ziel-Nenner</h2><p class="lead">Der Nenner des gekürzten Bruchs ist schon vorgegeben. Ermittle zuerst die Kürzungszahl, dann den neuen Zähler. Jede Aufgabe hat eigene Tipps!</p>${story('Diana','👩🏻‍🦰','Wenn aus dem Nenner 20 der Nenner 4 werden soll, rechne ich 20 : 4. So finde ich die Kürzungszahl.')}<div class="task-stack">${[['t1','Aufgabe 1',15,20,4],['t2','Aufgabe 2',8,12,3],['t3','Aufgabe 3',12,30,5]].map(x=>targetTask(...x)).join('')}</div>${feedback()}${s.passed[5]?'<section class="completion" aria-label="Abschluss"><div class="medal" aria-hidden="true">🏅</div><h3>Geschafft – du bist Bruchmagierin!</h3><p>Du hast alle <strong>6 Stationen</strong> geschafft. Du kannst Brüche kürzen, den Kürzungsweg aufschreiben und die Kürzungszahl aus dem Ziel-Nenner bestimmen.</p></section>':''}`;
}}
function validate(){let items={},details={},message='';switch(s.step){
case 0:items={pic:val('pic')==='b'};message='Vergleiche die eingefärbte Fläche. Gesucht ist die Hälfte.';break;
case 1:items={group:val('group')==='4',green:num('green')===1,all:num('all')===2};message='Fasse jeweils vier kleine Stücke zusammen und zähle die größeren Teile.';break;
case 2:items={rule:val('rule')==='both'};message='Zum Kürzen teilst du Zähler und Nenner durch dieselbe Zahl ohne Rest.';break;
case 3:for(const [k,a,b,d] of [['w1',6,9,3],['w2',8,12,4],['w3',15,20,5]]){const z=num(k+'zm')===d&&num(k+'zr')===a/d;const n=num(k+'nm')===d&&num(k+'nr')===b/d;const r=num(k+'n')===a/d&&num(k+'d')===b/d;items[k]=z&&n&&r;details[k]=!z?'Prüfe die Divisionsaufgabe für den Zähler.':!n?'Prüfe die Divisionsaufgabe für den Nenner.':'Übertrage die beiden Ergebnisse in den Ergebnisbruch.'}message='Prüfe die markierten Aufgaben. Beide Divisionen und der Ergebnisbruch müssen stimmen.';break;
case 4:items={err:val('error')==='only-top',fix:num('fixn')===2&&num('fixd')===3};message='Lisa hat den Zähler geteilt, den Nenner aber nicht. Ergänze beide richtigen Zahlen.';break;
case 5:for(const [k,a,b,t] of [['t1',15,20,4],['t2',8,12,3],['t3',12,30,5]]){const d=b/t;const step1=num(k+'m')===d;const step2=num(k+'zm')===d&&num(k+'calc')===a/d;const step3=num(k+'n')===a/d;items[k]=step1&&step2&&step3;details[k]=!step1?'Schritt 1: Teile den bisherigen Nenner durch den Ziel-Nenner.':!step2?'Schritt 2: Teile den Zähler durch dieselbe Kürzungszahl.':'Schritt 3: Übertrage den neuen Zähler in den Ergebnisbruch.'}message='Schau dir die markierten Schritte an. Bei Bedarf findest du unter jeder Aufgabe einen Tipp.';break;
}const all=Object.values(items).every(Boolean);const attempts=(s.checks[s.step]?.attempts||0)+1;s.checks[s.step]={all,items,details,message:all?'Alle Antworten sind richtig. Gut gearbeitet!':message,attempts};s.passed[s.step]=all;if(all){s.unlocked=Math.max(s.unlocked,Math.min(5,s.step+1));if(s.step===5)s.completedAt=new Date().toISOString()}else if(s.step===5)s.completedAt=null;save();render();const el=document.querySelector('.feedback');if(el)el.scrollIntoView({behavior:'smooth',block:'nearest'})}
function markDirty(){delete s.checks[s.step];if(s.passed[s.step]){s.passed[s.step]=false;if(s.step===5)s.completedAt=null}}
function nav(n){if(n<0||n>5||n>s.unlocked)return;s.step=n;save();render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){const count=s.passed.filter(Boolean).length;document.getElementById('progress-fill').style.width=(count/6*100)+'%';document.getElementById('progress-text').textContent=`${count} von 6 Stationen geschafft`;document.getElementById('step-list').innerHTML=names.map((name,i)=>`<button type="button" class="navstep ${i===s.step?'current':''} ${s.passed[i]?'done':''}" data-nav="${i}" ${i>s.unlocked?'disabled':''} ${i===s.step?'aria-current="step"':''}><span class="numb">${s.passed[i]?'✓':i+1}</span><span>${name}</span></button>`).join('');document.getElementById('eyebrow').textContent=`Station ${s.step+1} von 6`;document.getElementById('time').textContent=`⏳ ca. ${times[s.step]}`;const k=s.step;const lvl=Number(s.hintLevels[k]||0);document.getElementById('content').innerHTML=content()+`${lvl?`<div class="hintbox" role="status"><p><strong>💡 ${lvl>1?'Noch ein Tipp':'Tipp'}:</strong> ${hints[k][Math.min(lvl,2)-1]}</p></div>`:''}<div class="actions">${k>0?`<button class="btn secondary" type="button" data-nav="${k-1}">← Zurück</button>`:''}<button class="btn hint" type="button" data-hint ${lvl>=2?'disabled':''}>💡 ${lvl>=2?'Tipps eingeblendet':lvl?'Weiterer Tipp':'Tipp anzeigen'}</button>${k!==0&&k!==2?`<button class="btn primary" type="button" data-check>Antworten prüfen</button>`:''}${s.passed[k]&&k<5?`<button class="btn primary right" type="button" data-nav="${k+1}">Weiter →</button>`:''}${s.passed[k]&&k===5?'<button class="btn secondary right" type="button" data-print>🏅 Abschluss drucken</button>':''}</div>`;setSave()}
document.addEventListener('input',e=>{const el=e.target.closest('[data-entry]');if(!el)return;const cleaned=el.value.replace(/[^0-9]/g,'');if(cleaned!==el.value)el.value=cleaned;s.entries[el.dataset.entry]=el.value;markDirty();save()});
document.addEventListener('click',e=>{const n=e.target.closest('[data-nav]');if(n){nav(Number(n.dataset.nav));return}const c=e.target.closest('[data-choice]');if(c){s.entries[c.dataset.choice]=c.dataset.value;markDirty();save();if(s.step===0||s.step===2)validate();else render();return}const t=e.target.closest('[data-target-hint]');if(t){const k=t.dataset.targetHint;s.targetHintLevels[k]=Math.min(2,Number(s.targetHintLevels[k]||0)+1);save();render();return}if(e.target.closest('[data-hint]')){s.hintLevels[s.step]=Math.min(2,Number(s.hintLevels[s.step]||0)+1);save();render();return}if(e.target.closest('[data-check]')){validate();return}if(e.target.closest('[data-print]')){window.print();return}if(e.target.closest('#restart')){if(window.confirm('Willst du wirklich alle Antworten und den gesamten Lernfortschritt löschen?')){s=blank();save();render();window.scrollTo(0,0)}return}});
render();
})();
</script></body></html>
